<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Website</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>login</h1>

        <form>
            <label for="Username">Username:</label>
            <input type="gmail" id="username" pattern="[a-z]+[0-9]+@[yahoo|gmail]+\.[at|com|org|in|co|gov]+">
            <br><br>
            <label for="Password">Password:</label>
            <input type="password" id="password" pattern="(?=.*\d)(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,16}" required title="Password must contain at least one number, one uppercase and lowercase letter, and at least 8 or more characters." required>
            <br><br>
        </form>
        <br>
        <a href="./sign up.html">
        <button type="button">sign up</button>
        <a href="./submitted.html">
        <button type="button">login</button><br><br>

        <a href="./forgot password.html">
        <button type="button">forgot password</button>
        </a>
    </body>
</html>
