<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Website</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Forgot password</h1>

        <form action="./index.html">
            <label for="Gmail">Gmail:</label>
            <input type="gmail" id="gmail" name="gmail" pattern="[a-z]+[0-9]+@[yahoo|gmail]+\.[at|com|org|in|co|gov]+" required>
            <br>
            <label for="new password">new password:</label>
            <input type="new password" id="new password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,16}" required title="Password must contain at least one number, one uppercase and lowercase letter, and at least 8 or more characters." reguired>
            <br>
            <label for="current password">current password:</label>
            <input type="current password" id="current password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,16}" required title="Password must contain at least one number, one uppercase and lowercase letter, and at least 8 or more characters." reguired>
            <br>
            <button type="submit">submit</button>
        </form>
    </body>
</html>
